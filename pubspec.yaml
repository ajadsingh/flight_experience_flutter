name: flight_experience
publish_to: "none"
description: A passenger-focused Flutter flight experience app with GPS tracking, route simulation, offline POI data and live flight visualization.
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/pois.json
